apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.firebase.firebase-perf'

android {
  namespace 'com.delhivery.axle'
  compileSdk 35
  signingConfigs {
    release {
      keyAlias 'axle_delhivery'
      keyPassword 'delhivery'
      storeFile file('keystore/axle-release.jks')
      storePassword 'delhivery'
    }
  }
  defaultConfig {
    applicationId "com.dfd.delfin"
    minSdkVersion 24
    targetSdkVersion 35
    versionCode 144
    versionName "2.133.14"
    multiDexEnabled true
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables.useSupportLibrary = true
    signingConfig signingConfigs.release
  }
  buildTypes {
    debug {
      // Root detection disabled for development
      buildConfigField "boolean", "ROOT_DETECTION_ENABLED", "false"
    }
    
    release {
      // Root detection enabled in release builds
      buildConfigField "boolean", "ROOT_DETECTION_ENABLED", "true"
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      ndk {
        debugSymbolLevel= "FULL"
      }
    }

    //Production-like debuggable build
    releaseDebuggable {
      initWith release      // copy release config
      debuggable true       // make it debuggable
      // Root detection enabled for testing
      buildConfigField "boolean", "ROOT_DETECTION_ENABLED", "true"
      signingConfig signingConfigs.release
      minifyEnabled true
      shrinkResources true
    }

  }
  flavorDimensions+= "vanilla"
  productFlavors {
    development {
      dimension "vanilla"
      resValue "string", "app_name", "Dev Delfin"
      resValue("bool", "FIREBASE_ACTIVATED", "false")
      resValue("bool", "FIREBASE_PERFORMANCE_LOG", "true")

      resConfigs "en", "xxhdpi"
    }
    uat {
      dimension "vanilla"
      resValue "string", "app_name", "Stage Delfin"
      resValue("bool", "FIREBASE_ACTIVATED", "false")
      resValue("bool", "FIREBASE_PERFORMANCE_LOG", "true")

      resConfigs "en", "xxhdpi"
    }
    production {
      dimension "vanilla"
      resValue "string", "app_name", "Delfin"
      resValue("bool", "FIREBASE_ACTIVATED", "true")
      resValue("bool", "FIREBASE_PERFORMANCE_LOG", "false")
      signingConfig signingConfigs.release
    }
  }
  android {
    sourceSets {
      main.java.srcDirs += 'src/main/kotlin'
    }
  }
  dataBinding {
    enabled = true
  }
  buildFeatures {
    buildConfig = true
    viewBinding = true
  }
  lintOptions {
    checkReleaseBuilds false
    // Or, if you prefer, you can continue to check for errors in release builds,
    // but continue the build even when errors are found:
    abortOnError false
  }

  // Enable JUnit 5 for Kotest runner
  testOptions {
    unitTests.all {
      useJUnitPlatform()
    }
  }
  android {
    compileOptions {
      sourceCompatibility JavaVersion.VERSION_17
      targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
      jvmTarget = '17'
    }
  }
  
  // Fix for kapt with Java 17+
  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
      jvmTarget = "17"
    }
  }
  packaging {
    jniLibs {
      useLegacyPackaging = false
    }
  }
  applicationVariants.all { variant ->
    variant.outputs.all { output ->
      def project = "Axle"
      def SEP = "_"
      def flavor = variant.productFlavors[0].name
      def buildType = variant.buildType.name
      def version = variant.versionName
      def date = new Date()
      def formattedDate = date.format('ddMMyy_HHmm')
      def newApkName = project + SEP +
          flavor +
          SEP +
          buildType +
          SEP +
          version +
          SEP +
          formattedDate +
          ".apk"
      outputFileName = new File(newApkName)
    }
  }

  // Fix for Google Services task dependency issue in Gradle 8.x
  afterEvaluate {
    tasks.matching { it.name.startsWith('merge') && it.name.endsWith('Resources') }.configureEach { task ->
      def variantName = task.name.substring(5, task.name.length() - 9) // Remove 'merge' and 'Resources'
      def googleServicesTask = tasks.findByName("process${variantName}GoogleServices")
      if (googleServicesTask) {
        task.dependsOn googleServicesTask
      }
    }
  }
}
dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  //Android support libs
  implementation 'androidx.appcompat:appcompat:1.6.1'
  implementation "androidx.core:core-splashscreen:1.0.1"
  implementation 'androidx.recyclerview:recyclerview:1.3.2'
  implementation 'com.google.android.material:material:1.11.0'
  implementation 'androidx.cardview:cardview:1.0.0'
  //constraint layout
  implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
  implementation 'com.google.firebase:firebase-invites:17.0.0'
    implementation libs.androidx.activity
    //Test libraries
  testImplementation 'androidx.arch.core:core-testing:2.2.0'

  // Kotest - Test runner & assertions (JUnit 5 based) - using 5.9.x for Kotlin 1.9.x compatibility
  testImplementation 'io.kotest:kotest-runner-junit5:5.9.1'
  testImplementation 'io.kotest:kotest-assertions-core:5.9.1'
  testImplementation 'io.kotest:kotest-property:5.9.1'

  // MockK - Kotlin-native mocking (using android variant to avoid Jetifier issues)
  testImplementation 'io.mockk:mockk-android:1.13.13'
  testImplementation 'io.mockk:mockk-agent:1.13.13'

  // Coroutines testing - using version compatible with Kotlin 1.9.x
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'

  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

  // Kotest for property-based testing
  testImplementation 'io.kotest:kotest-runner-junit5:5.5.5'
  testImplementation 'io.kotest:kotest-assertions-core:5.5.5'
  testImplementation 'io.kotest:kotest-property:5.5.5'

  // Coroutines testing
  testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.6.4'

  // MockK for mocking
  testImplementation 'io.mockk:mockk:1.13.4'

  // Architecture Components testing
  testImplementation 'androidx.arch.core:core-testing:2.2.0'
  //Kotlin SDK
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
  //Dagger 2
  implementation "com.google.dagger:dagger:$dagger2Version"
  kapt "com.google.dagger:dagger-compiler:$dagger2Version"
  implementation "com.google.dagger:dagger-android:$dagger2Version"
  implementation "com.google.dagger:dagger-android-support:$dagger2Version"
  kapt "com.google.dagger:dagger-android-processor:$dagger2Version"
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
  //Retrofit2
  implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
  implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
  implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion"
  implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"
  //  Rx
  implementation "io.reactivex.rxjava2:rxjava:$rxJavaVersion"
  implementation "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion"
  //  implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.5@aar'
  implementation 'com.jakewharton.rxbinding2:rxbinding:2.2.0'
  //Architecture Components
  implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
  implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
  kapt 'androidx.lifecycle:lifecycle-compiler:2.7.0'
  //Room library
  implementation 'androidx.room:room-runtime:2.6.1'
  kapt 'androidx.room:room-compiler:2.6.1'
  implementation 'androidx.room:room-rxjava2:2.6.1'
  //Glide
  implementation "com.github.bumptech.glide:glide:$glideVersion"
  kapt "com.github.bumptech.glide:compiler:$glideVersion"
  //JWT Decode library
  implementation 'com.auth0.android:jwtdecode:1.2.0'
  //Firebase
  implementation 'com.google.firebase:firebase-core:20.0.0'
  implementation 'com.google.firebase:firebase-inappmessaging-display:20.1.1'
  implementation 'com.google.firebase:firebase-config:20.0.4'
  implementation 'com.google.firebase:firebase-messaging:22.0.0'
  implementation platform('com.google.firebase:firebase-bom:33.4.0')
  implementation 'com.google.firebase:firebase-crashlytics-ktx'
  implementation 'com.google.firebase:firebase-analytics-ktx'
  implementation 'com.google.firebase:firebase-crashlytics:18.2.4'
  implementation 'com.google.firebase:firebase-analytics:20.0.0'
  implementation 'com.google.firebase:firebase-dynamic-links:21.0.0'
  implementation 'com.google.firebase:firebase-inappmessaging-display-ktx:20.1.1'
  //Coroutines & Work Manager
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.1"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.1"
  implementation "androidx.room:room-ktx:2.6.1"
  implementation "com.google.android.gms:play-services-location:21.3.0"
  implementation "com.moengage:moe-android-sdk:$moengageSdkVersion"
  implementation("androidx.core:core:1.12.0")
  implementation("androidx.lifecycle:lifecycle-process:2.7.0")
  implementation "androidx.work:work-runtime-ktx:2.9.0"

  implementation 'com.google.android.play:app-update-ktx:2.1.0'
    implementation "androidx.fragment:fragment-ktx:1.8.9"

    //Lottie
    implementation("com.airbnb.android:lottie:6.7.1")


    // Chucker
  debugImplementation ("com.github.chuckerteam.chucker:library:3.5.2") {
    exclude group: 'androidx.lifecycle', module:'lifecycle-viewmodel'
    exclude group: 'androidx.lifecycle', module:'lifecycle-viewmodel-ktx'
  }

  releaseDebuggableImplementation "com.github.chuckerteam.chucker:library-no-op:3.5.2"

  releaseImplementation "com.github.chuckerteam.chucker:library-no-op:3.5.2"

  implementation "com.google.firebase:firebase-perf-ktx:20.5.1"

  // LeakCanary
//  debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.7'

    //fragment ktx dependency
    implementation "androidx.fragment:fragment-ktx:1.8.9"

    // Encrypted SharedPreferences
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
}
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'