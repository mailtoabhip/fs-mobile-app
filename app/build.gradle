apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.fabric'

android {
  compileSdkVersion 29

  signingConfigs {
    release {
      keyAlias 'axle_delhivery'
      keyPassword 'delhivery'
      storeFile file('keystore/axle-release.jks')
      storePassword 'delhivery'
    }
  }

  defaultConfig {
    applicationId "com.delhivery.axle"
    minSdkVersion 19
    targetSdkVersion 29
    versionCode 17
    versionName "1.16"
    multiDexEnabled true
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    vectorDrawables.useSupportLibrary = true
    signingConfig signingConfigs.release
  }

  buildTypes {
    release {
      minifyEnabled true
      shrinkResources true
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  flavorDimensions "vanilla"

  productFlavors {
    development {
      dimension "vanilla"
      resValue "string", "app_name", "Dev Axle"
      resValue("bool", "FIREBASE_ACTIVATED", "false")
      resConfigs "en", "xxhdpi"
    }
    uat {
      dimension "vanilla"
      resValue "string", "app_name", "Stage Axle"
      resValue("bool", "FIREBASE_ACTIVATED", "false")
      resConfigs "en", "xxhdpi"
    }
    production {
      dimension "vanilla"
      resValue "string", "app_name", "Axle"
      resValue("bool", "FIREBASE_ACTIVATED", "true")
      signingConfig signingConfigs.release
    }
  }

  android {
    sourceSets {
      main.java.srcDirs += 'src/main/kotlin'
    }
  }

  dataBinding {
    enabled = true
  }

  lintOptions {
    checkReleaseBuilds false
    // Or, if you prefer, you can continue to check for errors in release builds,
    // but continue the build even when errors are found:
    abortOnError false
  }

  android {
    compileOptions {
      sourceCompatibility JavaVersion.VERSION_1_8
      targetCompatibility JavaVersion.VERSION_1_8
    }
  }

  applicationVariants.all { variant ->
    variant.outputs.all { output ->
      def project = "Axle"
      def SEP = "_"
      def flavor = variant.productFlavors[0].name
      def buildType = variant.variantData.variantConfiguration.buildType.name
      def version = variant.versionName
      def date = new Date()
      def formattedDate = date.format('ddMMyy_HHmm')

      def newApkName = project + SEP +
          flavor +
          SEP +
          buildType +
          SEP +
          version +
          SEP +
          formattedDate +
          ".apk"

      outputFileName = new File(newApkName)
    }
  }
}

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])

  //Android support libs
  implementation 'androidx.appcompat:appcompat:1.1.0'
  implementation 'androidx.recyclerview:recyclerview:1.1.0'
  implementation 'com.google.android.material:material:1.0.0'
  implementation 'androidx.cardview:cardview:1.0.0'

  //constraint layout
  implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

  //Test libraries
  testImplementation 'junit:junit:4.12'
  androidTestImplementation 'androidx.test:runner:1.2.0'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

  //Kotlin SDK
  implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  //Dagger 2
  implementation "com.google.dagger:dagger:$dagger2Version"
  kapt "com.google.dagger:dagger-compiler:$dagger2Version"
  implementation "com.google.dagger:dagger-android:$dagger2Version"
  implementation "com.google.dagger:dagger-android-support:$dagger2Version"
  kapt "com.google.dagger:dagger-android-processor:$dagger2Version"

  //Retrofit2
  implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
  implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
  implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion"
  implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"

  //  Rx
  implementation "io.reactivex.rxjava2:rxjava:$rxJavaVersion"
  implementation "io.reactivex.rxjava2:rxandroid:$rxAndroidVersion"
  //  implementation 'com.tbruyelle.rxpermissions2:rxpermissions:0.9.5@aar'
  implementation 'com.jakewharton.rxbinding2:rxbinding:2.2.0'

  //Architecture Components
  implementation 'androidx.lifecycle:lifecycle-runtime:2.0.0'
  implementation 'androidx.lifecycle:lifecycle-extensions:2.0.0'
  kapt 'androidx.lifecycle:lifecycle-compiler:2.0.0'

  //Room library
  implementation 'androidx.room:room-runtime:2.1.0'
  kapt 'androidx.room:room-compiler:2.1.0'
  implementation 'androidx.room:room-rxjava2:2.1.0'

  //Kotlin please animate - animation library
  implementation 'com.github.florent37:kotlinpleaseanimate:1.0.2'

  //Glide
  implementation "com.github.bumptech.glide:glide:$glideVersion"
  kapt "com.github.bumptech.glide:compiler:$glideVersion"

  //JWT Decode library
  implementation 'com.auth0.android:jwtdecode:1.2.0'

  //Firebase
  implementation 'com.google.firebase:firebase-core:17.2.1'
  implementation 'com.google.firebase:firebase-inappmessaging-display:19.0.2'
  implementation 'com.google.firebase:firebase-config:19.0.3'
  implementation 'com.google.firebase:firebase-messaging:20.0.1'
  implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'

  //AWS sdk
  implementation 'com.amazonaws:aws-android-sdk-s3:2.15+'
  implementation('com.amazonaws:aws-android-sdk-mobile-client:2.15+@aar') { transitive = true }
  implementation('com.amazonaws:aws-android-sdk-auth-userpools:2.15+@aar')
}
apply plugin: 'com.google.gms.google-services'
