  upload-firebase:
    needs: [setup, build]
    if: needs.setup.outputs.firebase-configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download APK Artifact
        if: needs.setup.outputs.output-type == 'apk'
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: ./artifact
          merge-multiple: true

      - name: Download Bundle Artifact
        if: needs.setup.outputs.output-type == 'bundle'
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: ./artifact
          merge-multiple: true

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: devs
          file: ./artifact/${{ needs.build.outputs.artifact-name }}
          releaseNotes: |
            Build #${{ github.run_number }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Variant: ${{ needs.setup.outputs.variant }}
            Artifact: ${{ needs.build.outputs.artifact-name }}
            Checksum: ${{ needs.build.outputs.checksum }}


  # Google Chat Notification
  notify:
    needs: [setup, build, upload-firebase]
    if: always() && needs.setup.outputs.gchat-configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Calculate Build Duration
        id: duration
        run: |
          START_TIME=${{ needs.setup.outputs.build-start-time }}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "duration=${MINUTES}m ${SECONDS}s" >> $GITHUB_OUTPUT

      - name: Determine Build Status
        id: status
        run: |
          if [ "${{ needs.build.result }}" == "success" ]; then
            echo "status=✅ SUCCESS" >> $GITHUB_OUTPUT
            echo "color=#34A853" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
            echo "color=#EA4335" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ ${{ needs.build.result }}" >> $GITHUB_OUTPUT
            echo "color=#FBBC04" >> $GITHUB_OUTPUT
          fi

      - name: Checkout for branch detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Source Branch
        id: branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BRANCH=$(git branch -r --contains ${{ github.sha }} \
              | grep -v HEAD \
              | head -n 1 \
              | sed 's|origin/||' \
              | xargs)
            echo "branch=${BRANCH:-unknown}" >> $GITHUB_OUTPUT
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
          fi

      - name: Send Google Chat Notification
        run: |
          curl -X POST "${{ secrets.GCHAT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cards": [{
                "header": {
                  "title": "Android Build ${{ steps.status.outputs.status }}",
                  "subtitle": "${{ github.repository }}"
                },
                "sections": [{
                  "widgets": [
                    {
                      "keyValue": {
                        "topLabel": "Branch",
                        "content": "${{ steps.branch.outputs.branch }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Tag",
                        "content": "${{ steps.branch.outputs.tag || 'N/A' }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Variant",
                        "content": "${{ needs.setup.outputs.variant }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Output",
                        "content": "${{ needs.setup.outputs.output-type }} (${{ needs.setup.outputs.signed == 'true' && 'signed' || 'unsigned' }})"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Size",
                        "content": "${{ needs.build.outputs.artifact-size-mb }} MB"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Build Duration",
                        "content": "${{ steps.duration.outputs.duration }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Triggered by",
                        "content": "${{ github.actor }}"
                      }
                    }
                  ]
                },
                {
                  "widgets": [{
                    "buttons": [{
                      "textButton": {
                        "text": "View Build/Artifacts",
                        "onClick": {
                          "openLink": {
                            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                          }
                        }
                      }
                    }]
                  }]
                }]
              }]
            }'

  # Notify on failure even if Firebase upload is skipped
  notify-failure:
    needs: [setup, lint, test, build]
    if: failure() && needs.setup.outputs.gchat-configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Calculate Build Duration
        id: duration
        run: |
          START_TIME=${{ needs.setup.outputs.build-start-time }}
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          MINUTES=$((DURATION / 60))
          SECONDS=$((DURATION % 60))
          echo "duration=${MINUTES}m ${SECONDS}s" >> $GITHUB_OUTPUT

      - name: Determine Failed Job
        id: failed
        run: |
          FAILED_JOB=""
          [ "${{ needs.lint.result }}" == "failure" ] && FAILED_JOB="Lint"
          [ "${{ needs.test.result }}" == "failure" ] && FAILED_JOB="Test"
          [ "${{ needs.build.result }}" == "failure" ] && FAILED_JOB="Build"
          echo "job=$FAILED_JOB" >> $GITHUB_OUTPUT

      - name: Checkout for branch detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Source Branch
        id: branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            BRANCH=$(git branch -r --contains ${{ github.sha }} \
              | grep -v HEAD \
              | head -n 1 \
              | sed 's|origin/||' \
              | xargs)
            echo "branch=${BRANCH:-unknown}" >> $GITHUB_OUTPUT
          else
            echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Send Failure Notification
        run: |
          curl -X POST "${{ secrets.GCHAT_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cards": [{
                "header": {
                  "title": "❌ Android Build FAILED",
                  "subtitle": "${{ github.repository }}"
                },
                "sections": [{
                  "widgets": [
                    {
                      "keyValue": {
                        "topLabel": "Failed Job",
                        "content": "${{ steps.failed.outputs.job }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Branch",
                        "content": "${{ steps.branch.outputs.branch }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Build Duration",
                        "content": "${{ steps.duration.outputs.duration }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Triggered by",
                        "content": "${{ github.actor }}"
                      }
                    }
                  ]
                },
                {
                  "widgets": [{
                    "buttons": [{
                      "textButton": {
                        "text": "View Logs",
                        "onClick": {
                          "openLink": {
                            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                          }
                        }
                      }
                    }]
                  }]
                }]
              }]
            }'
