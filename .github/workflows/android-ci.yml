#          ${COMMITS}"
#
#          # Escape for GitHub output
#          NOTES_ESCAPED="${NOTES//'%'/'%25'}"
#          NOTES_ESCAPED="${NOTES_ESCAPED//$'\n'/'%0A'}"
#          NOTES_ESCAPED="${NOTES_ESCAPED//$'\r'/'%0D'}"
#
#          echo "notes<<EOF" >> $GITHUB_OUTPUT
#          echo "$NOTES" >> $GITHUB_OUTPUT
#          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Summary
        run: |
          echo "## 📦 Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | ${{ steps.build-apk.outputs.artifact-name }}${{ steps.build-bundle.outputs.artifact-name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Size | ${{ steps.build-apk.outputs.artifact-size-mb }}${{ steps.build-bundle.outputs.artifact-size-mb }} MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Variant | ${{ needs.setup.outputs.variant }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Output Type | ${{ needs.setup.outputs.output-type }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed | ${{ needs.setup.outputs.signed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Checksum | \`${{ steps.build-apk.outputs.checksum }}${{ steps.build-bundle.outputs.checksum }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Changelog
          echo "## 📝 Recent Changes" >> $GITHUB_STEP_SUMMARY
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -10 >> $GITHUB_STEP_SUMMARY
          else
            git log -10 --pretty=format:"- %s" --no-merges >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: needs.setup.outputs.output-type == 'apk'
        with:
          name: apk-${{ needs.setup.outputs.variant }}
          path: ${{ steps.build-apk.outputs.artifact-path }}
          retention-days: 7

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        if: needs.setup.outputs.output-type == 'bundle'
        with:
          name: bundle-${{ needs.setup.outputs.variant }}
          path: ${{ steps.build-bundle.outputs.artifact-path }}
          retention-days: 7

