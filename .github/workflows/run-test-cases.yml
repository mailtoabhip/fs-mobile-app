name: PR Test Cases

on:
  pull_request:
    branches:
      - 'development-v*'
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      variant: ${{ steps.variant.outputs.variant }}
      flavor: ${{ steps.variant.outputs.flavor }}
      flavor-cap: ${{ steps.variant.outputs.flavor-cap }}
      build-type: ${{ steps.variant.outputs.build-type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set Build Variant
        id: variant
        run: |
          # Default to uatDebug for PR tests
          FLAVOR="uat"
          BUILD_TYPE="Debug"
          FLAVOR_CAP="Uat"
          VARIANT="uatDebug"
          
          echo "variant=$VARIANT" >> $GITHUB_OUTPUT
          echo "flavor=$FLAVOR" >> $GITHUB_OUTPUT
          echo "flavor-cap=$FLAVOR_CAP" >> $GITHUB_OUTPUT
          echo "build-type=$BUILD_TYPE" >> $GITHUB_OUTPUT
          
          echo "Testing variant: $VARIANT"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-deps-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-deps-

  test:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      total-tests: ${{ steps.test-results.outputs.total-tests }}
      passed-tests: ${{ steps.test-results.outputs.passed-tests }}
      failed-tests: ${{ steps.test-results.outputs.failed-tests }}
      coverage: ${{ steps.test-results.outputs.coverage }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run Unit Tests
        run: ./gradlew test${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }}UnitTest

      - name: Generate Coverage Report
        run: ./gradlew koverXmlReport${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }} koverHtmlReport${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }}
        continue-on-error: true

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/test-results/
            app/build/reports/tests/
          retention-days: 7

      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            app/build/reports/kover/
          retention-days: 7

      - name: Extract Test Results
        id: test-results
        if: always()
        run: |
          TEST_RESULTS_DIR="app/build/test-results/test${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }}UnitTest"
          
          TOTAL_TESTS=0
          FAILURES=0
          
          if [ -d "$TEST_RESULTS_DIR" ]; then
            TOTAL_TESTS=$(grep -r 'tests=' "$TEST_RESULTS_DIR"/*.xml 2>/dev/null | grep -oP 'tests="\K[0-9]+' | awk '{sum+=$1} END {print sum}' || echo "0")
            FAILURES=$(grep -r 'failures=' "$TEST_RESULTS_DIR"/*.xml 2>/dev/null | grep -oP 'failures="\K[0-9]+' | awk '{sum+=$1} END {print sum}' || echo "0")
          fi
          
          PASSED=$((TOTAL_TESTS - FAILURES))
          
          # Coverage
          COVERAGE="N/A"
          KOVER_REPORT="app/build/reports/kover/report${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }}.xml"
          if [ -f "$KOVER_REPORT" ]; then
            COVERAGE_RAW=$(grep -oP 'line-rate="\K[^"]+' "$KOVER_REPORT" | head -1 || echo "")
            if [ -n "$COVERAGE_RAW" ]; then
              COVERAGE=$(echo "scale=1; $COVERAGE_RAW * 100" | bc)%
            fi
          fi
          
          echo "total-tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "passed-tests=$PASSED" >> $GITHUB_OUTPUT
          echo "failed-tests=$FAILURES" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "✅ Passed: ${{ steps.test-results.outputs.passed-tests }} / ${{ steps.test-results.outputs.total-tests }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.test-results.outputs.failed-tests }}" -gt 0 ]; then
            echo "❌ Failed: ${{ steps.test-results.outputs.failed-tests }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Top Failed Test Cases" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            TEST_RESULTS_DIR="app/build/test-results/test${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }}UnitTest"
            
            # Use Python to parse XML and extract failed tests
            python3 << 'EOF' >> $GITHUB_STEP_SUMMARY
          import xml.etree.ElementTree as ET
          import glob
          import os
          
          test_dir = os.environ.get('TEST_RESULTS_DIR', 'app/build/test-results/testUatDebugUnitTest')
          failed_tests = []
          
          for xml_file in glob.glob(f"{test_dir}/*.xml"):
              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  
                  for testcase in root.iter('testcase'):
                      failure = testcase.find('failure')
                      error = testcase.find('error')
                      if failure is not None or error is not None:
                          classname = testcase.get('classname', '')
                          name = testcase.get('name', '')
                          if classname and name:
                              failed_tests.append(f"{classname}.{name}")
              except Exception as e:
                  pass
          
          # Print top 5 failed tests
          for test in failed_tests[:5]:
              print(f"- `{test}`")
          
          if not failed_tests:
              print("- Unable to parse failed test names")
          EOF
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "📊 Line Coverage: **${{ steps.test-results.outputs.coverage }}**" >> $GITHUB_STEP_SUMMARY
        env:
          TEST_RESULTS_DIR: app/build/test-results/test${{ needs.setup.outputs.flavor-cap }}${{ needs.setup.outputs.build-type }}UnitTest

  notify:
    needs: [setup, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Determine Status
        id: status
        run: |
          if [ "${{ needs.test.result }}" == "failure" ]; then
            echo "status=❌ FAILED" >> $GITHUB_OUTPUT
          elif [ "${{ needs.test.result }}" == "success" ]; then
            echo "status=✅ PASSED" >> $GITHUB_OUTPUT
          else
            echo "status=⚠️ ${{ needs.test.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Send Google Chat Notification
        run: |
          curl -X POST "${{ secrets.GCHAT_TEST_CASE_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "cards": [{
                "header": {
                  "title": "PR Test Cases ${{ steps.status.outputs.status }}",
                  "subtitle": "${{ github.repository }}"
                },
                "sections": [{
                  "widgets": [
                    {
                      "keyValue": {
                        "topLabel": "Pull Request",
                        "content": "#${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Source Branch",
                        "content": "${{ github.head_ref }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Target Branch",
                        "content": "${{ github.base_ref }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Tests",
                        "content": "${{ needs.test.outputs.passed-tests }}/${{ needs.test.outputs.total-tests }} passed (${{ needs.test.outputs.failed-tests }} failed)"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Coverage",
                        "content": "${{ needs.test.outputs.coverage }}"
                      }
                    },
                    {
                      "keyValue": {
                        "topLabel": "Author",
                        "content": "${{ github.event.pull_request.user.login }}"
                      }
                    }
                  ]
                },
                {
                  "widgets": [{
                    "buttons": [
                      {
                        "textButton": {
                          "text": "View PR",
                          "onClick": {
                            "openLink": {
                              "url": "${{ github.event.pull_request.html_url }}"
                            }
                          }
                        }
                      },
                      {
                        "textButton": {
                          "text": "View Logs",
                          "onClick": {
                            "openLink": {
                              "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                            }
                          }
                        }
                      }
                    ]
                  }]
                }]
              }]
            }'
